# Outside Unraid: docker compose up -d, then open http://<host>:8080
services:
  endfield-checkin:
    image: ghcr.io/mrpatates/endfield-checkin:latest
    container_name: Endfield-Check-in
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    environment:
      TZ: Europe/Paris
      CHECK_INTERVAL: "120"
      SKPORT_LANGUAGE: en
      # DISCORD_WEBHOOK: https://discord.com/api/webhooks/...
      # WEBUI_PASSWORD: change-me
      PUID: "1000"
      PGID: "1000"
